name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ipo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            sleep 2
          done

      - name: Run migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in backend/database/migrations/*.sql; do
            psql -h localhost -U postgres -d ipo_test -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify core tables
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ipo_test -v ON_ERROR_STOP=1 -c "SELECT 1 FROM analyses LIMIT 1;"
          psql -h localhost -U postgres -d ipo_test -v ON_ERROR_STOP=1 -c "SELECT 1 FROM agent_runs LIMIT 1;"
          psql -h localhost -U postgres -d ipo_test -v ON_ERROR_STOP=1 -c "SELECT 1 FROM checkpoints LIMIT 1;"
          psql -h localhost -U postgres -d ipo_test -v ON_ERROR_STOP=1 -c "SELECT 1 FROM agent_improvements LIMIT 1;"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ipo_test
        run: pytest tests/ -v